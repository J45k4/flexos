name: Flexscript FlexOS

on:
  push:
    branches: [master]
    paths: ['kernel.flex', 'baremetal.flex', 'desktop.flex', 'doom.flex', 'linux.flex', 'examples/**', 'ports/**', 'core/**', 'platform/**', 'apps/**', 'tools/**', 'tests/**', '.github/workflows/flex.yml', '.gitignore']
  pull_request:
    branches: [master]
    paths: ['kernel.flex', 'baremetal.flex', 'desktop.flex', 'doom.flex', 'linux.flex', 'examples/**', 'ports/**', 'core/**', 'platform/**', 'apps/**', 'tools/**', 'tests/**', '.github/workflows/flex.yml', '.gitignore']
  workflow_dispatch:
    inputs:
      flexscript_ref:
        description: Flexscript source revision containing bare-metal native callbacks and 16/32-bit port I/O
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl3 ca-certificates
      - name: Download and checksum the released native compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/compiler
          gh release download 0.0.5 --repo J45k4/flexscript --dir build/compiler \
            --pattern flexscript-0.0.5-linux-x86_64 \
            --pattern flexscript-core-0.0.5-linux-x86_64 --pattern SHA256SUMS
          (cd build/compiler && sha256sum --check SHA256SUMS)
          chmod +x build/compiler/flexscript-0.0.5-linux-x86_64
      - name: Check out the pinned VM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: J45k4/flexscript
          ref: a06c7e02422711c21fef4e6df4a86cf25cce84eb
          path: build/vm-source
          persist-credentials: false
      - name: Build the VM, kernel, and tools using released Flexscript
        run: |
          compiler="$PWD/build/compiler/flexscript-0.0.5-linux-x86_64"
          "$compiler" build/vm-source/compiler/main.flex -o build/flex-vm
          "$compiler" tools/build.flex -o build/build
          build/build "$compiler"
      - name: Test resources, shell, VM capabilities and real terminal interaction
        run: |
          build/test-flexos build/compiler/flexscript-0.0.5-linux-x86_64 build/flex-vm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flexos-hosted-linux-x86_64
          path: build/flexos

  baremetal:
    name: Boot native FlexOS in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the emulator and compiler runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-system-gui libssl3 ca-certificates sway libxkbcommon0 libsdl2-2.0-0 fonts-dejavu-core libgl1-mesa-dri build-essential gcc-multilib libx11-dev:i386 libxext-dev:i386 curl unzip
      - name: Download and checksum the released compiler seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/compiler
          gh release download 0.0.5 --repo J45k4/flexscript --dir build/compiler \
            --pattern flexscript-0.0.5-linux-x86_64 \
            --pattern flexscript-core-0.0.5-linux-x86_64 --pattern SHA256SUMS
          (cd build/compiler && sha256sum --check SHA256SUMS)
          chmod +x build/compiler/flexscript-0.0.5-linux-x86_64
      - name: Check out the requested compiler source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: J45k4/flexscript
          ref: ${{ inputs.flexscript_ref || 'master' }}
          path: build/compiler-source
          persist-credentials: false
      - name: Build compiler, kernel and test tools using Flexscript
        run: |
          git -C build/compiler-source rev-parse HEAD
          build/compiler/flexscript-0.0.5-linux-x86_64 build/compiler-source/compiler/main.flex -o build/flex
          build/flex tools/build-baremetal.flex -o build/build-baremetal
          build/build-baremetal build/flex
      - name: Verify real bare-metal boot, ring-0 long mode and halt
        run: build/test-baremetal build/flex qemu-system-x86_64
      - name: Verify graphical desktop using real PS/2 input and framebuffer capture
        run: build/test-desktop build/flex qemu-system-x86_64
      - name: Verify Wayland host mouse capture, movement, clicks and dragging headlessly
        run: build/test-desktop-wayland build/flex qemu-system-x86_64 sway
      - name: Build Linux ABI kernel and run unchanged Linux executables headlessly
        run: |
          build/flex tools/build-linux.flex -o build/build-linux
          build/build-linux build/flex
          build/test-linux build/flex qemu-system-x86_64
          build/test-linux-x11 build/flex qemu-system-x86_64
      - name: Fetch verified game dependencies and build native Doom with Flexscript tools
        run: |
          build/flex tools/fetch-doom.flex -o build/fetch-doom
          build/fetch-doom
          build/flex tools/build-doom.flex -o build/build-doom
          build/build-doom build/flex build/doom-deps/doomgeneric-dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284/doomgeneric
      - name: Verify real Doom graphics, movement, key release, mouse and firing headlessly
        run: build/test-doom qemu-system-x86_64 build/doom-deps/freedoom-0.13.0/freedoom1.wad
      - name: Verify Doom W/S and arrows through the SDL host keyboard path headlessly
        run: build/test-doom-wayland qemu-system-x86_64 build/doom-deps/freedoom-0.13.0/freedoom1.wad sway
      - name: Build unchanged historical id Linux Doom using normal 32-bit libc and Xlib
        run: |
          build/flex tools/build-linux-doom.flex -o build/build-linux-doom
          build/build-linux-doom build/flex \
            build/doom-deps/DOOM-a77dfb96cb91780ca334d0d4cfd86957558007e0/linuxdoom-1.10 \
            build/doom-deps/freedoom-0.13.0/freedoom1.wad
      - name: Verify historical Linux Doom ring-3 gameplay, X11 shared memory and clean exit headlessly
        run: build/test-linux-doom qemu-system-x86_64
      - name: Verify historical Linux Doom SDL start, reversal and release latency headlessly
        run: build/test-linux-doom-wayland qemu-system-x86_64 sway
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flexos-baremetal-x86_64
          path: |
            build/flexos-baremetal.bin
            build/flexos-desktop.bin
            build/desktop-tests/*.png
            build/flexos-doom.bin
            build/flexos-linux.bin
            build/linux/hello.elf
            build/doom-tests/*.png
            build/linux-id-doom-tests/*.png
